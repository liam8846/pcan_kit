[package]
name = "pcan-kit"
description = "跨平台產品級 CAN 通訊函式庫門面"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
default = ["basic", "socketcan", "tracing"]
basic = ["dep:pcan-basic"]
socketcan = ["dep:pcan-socketcan"]
tracing = [
    "dep:tracing",
    "pcan-link/tracing",
    "pcan-basic?/tracing",
    "pcan-socketcan?/tracing",
]
serde = ["pcan-core/serde"]
test-util = ["pcan-core/test-util"]
vcan-tests = ["socketcan"]

[dependencies]
pcan-core = { workspace = true }
pcan-link = { workspace = true }
pcan-basic = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pcan-socketcan = { workspace = true, optional = true }

[dev-dependencies]
pcan-core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
