[package]
name = "pcan-socketcan"
description = "以 libc 與 Tokio AsyncFd 實作的 Linux SocketCAN 後端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["tracing"]
tracing = ["dep:tracing"]
# 只啟用 tests/ 下的 Linux vcan 整合測試，不影響函式庫程式碼。
# 測試在執行期再檢查 PCAN_VCAN 環境變數；未武裝時自行跳過。
vcan-tests = []

[dependencies]
pcan-core = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
tracing = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
