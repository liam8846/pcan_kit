[package]
name = "pcan-core"
description = "pcan_kit 的核心型別、錯誤與傳輸抽象"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["embedded-can"]
embedded-can = ["dep:embedded-can"]
serde = ["dep:serde", "bitflags/serde"]
test-util = ["dep:tokio"]

[dependencies]
thiserror = { workspace = true }
bitflags = { workspace = true }
embedded-can = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "rt"] }

[dev-dependencies]
serde_json = "1"
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "test-util"] }
