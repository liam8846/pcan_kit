name: Docs

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 建置已通過 CI 的 API 文件
    if: >-
      vars.PUBLISH_DOCS == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: 確認同一提交的主分支 CI 仍通過
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$sha" -f branch=master -f event=push -f per_page=100 \
            > "$RUNNER_TEMP/docs-ci.json"
          python3 - <<'PYCODE'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from verify_release import has_successful_ci
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          runs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'docs-ci.json').read_text())
          if not has_successful_ci(runs, sha):
              raise SystemExit('此提交尚無成功的主分支 push CI')
          PYCODE
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: docs
      - name: 建置文件與首頁
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --all-features --no-deps --locked
          printf '%s\n' '<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=pcan_kit/index.html"><title>pcan_kit API</title><a href="pcan_kit/index.html">開啟 API 文件</a></html>' > target/doc/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/doc

  deploy:
    name: 部署 GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
