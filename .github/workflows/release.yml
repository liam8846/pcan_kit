name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 驗證版本、主分支 CI 與人工審核設定
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 檢查發版條件與產生發行說明
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$sha" origin/master
          gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$sha" -f branch=master -f event=push -f per_page=100 \
            > "$RUNNER_TEMP/release-ci.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/hardware-acceptance" \
            > "$RUNNER_TEMP/release-environment.json"
          python3 .github/scripts/verify_release.py --tag "$RELEASE_TAG" --sha "$sha" \
            --runs "$RUNNER_TEMP/release-ci.json" \
            --environment "$RUNNER_TEMP/release-environment.json" --notes-output release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  build:
    name: 封裝（${{ matrix.target }}）
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-${{ matrix.target }}
      - name: 建置五個範例
        run: cargo build --release --locked -p pcan-kit --examples --target ${{ matrix.target }}
      - name: 封裝範例、文件與授權
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python .github/scripts/package_release.py --tag "$RELEASE_TAG" --target "$RELEASE_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: 確認此發行提交已完成實機驗收
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: hardware-acceptance
    steps:
      - name: 記錄人工核准的發行提交
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: echo "人工核准實機驗收的發行提交：$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: 發布 GitHub Release
    needs: [validate, build, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: 校驗成品完整性並發布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: python3 .github/scripts/publish_release.py --directory release --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
