[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/liam8846/pcan_kit"

[workspace.dependencies]
pcan-core = { path = "crates/pcan-core", version = "0.1.0" }
pcan-basic-sys = { path = "crates/pcan-basic-sys", version = "0.1.0" }
pcan-basic = { path = "crates/pcan-basic", version = "0.1.0" }
pcan-socketcan = { path = "crates/pcan-socketcan", version = "0.1.0" }
pcan-link = { path = "crates/pcan-link", version = "0.1.0" }
pcan-kit = { path = "crates/pcan-kit", version = "0.1.0" }

thiserror = "2.0"
bitflags = "2.13"
tracing = "0.1.44"
libloading = "0.8.9"
libc = "0.2.189"
embedded-can = "0.4.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53", default-features = false }
windows-sys = "0.61"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
